/* landing */
.choice{
  position:absolute;left:0;right:0;top:15%;
  display:flex;justify-content:center;align-items:center;gap:clamp(28px,6vw,72px);
}
.choice a{
  font-weight:300;font-size:clamp(34px,5.2vw,68px);
  color:var(--silver);text-decoration:none;letter-spacing:.01em;
  padding:.1em .15em;border-bottom:2px solid transparent;
  transition:border-color .2s,color .2s;
}
.choice a:hover,.choice a:focus-visible{border-color:var(--burgundy-hover);outline:none}
.choice .divider{width:1px;height:clamp(60px,9vw,120px);background:var(--line)}

/* panels */
.panel{
  position:absolute;
  border:2px solid var(--line);
  border-radius:44px;
  background:rgba(8,9,12,.38);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:clamp(22px,2.4vw,34px);
}
#login .panel{left:3.2vw;top:13vh;width:clamp(330px,29vw,400px)}
#signup .panel{right:3.2vw;top:2.4vh;width:clamp(340px,35vw,450px)}

h1{font-weight:300;font-size:30px;margin-bottom:22px;letter-spacing:.01em}
.field{margin-bottom:16px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input{
  width:100%;height:42px;padding:0 14px;
  font:inherit;font-size:16px;color:var(--silver);
  background:rgba(255,255,255,.07);
  border:1px solid rgba(220,222,228,.35);border-radius:12px;
  transition:border-color .15s,background .15s;
}
input::placeholder{color:rgba(220,222,228,.35)}
input:focus{outline:none;border-color:var(--burgundy-hover);background:rgba(255,255,255,.11);box-shadow:0 0 0 3px rgba(164,27,66,.35)}
input.bad{border-color:var(--err)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{display:block;min-height:0;font-size:12.5px;color:var(--err);margin-top:5px}
.err:empty{display:none}

button{
  width:100%;height:46px;margin-top:8px;
  font:inherit;font-size:17px;font-weight:600;letter-spacing:.02em;
  color:#fff;background:var(--burgundy);
  border:0;border-radius:12px;cursor:pointer;
  transition:background .15s,transform .05s;
}
button:hover{background:var(--burgundy-hover)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}

.alt{margin-top:18px;font-size:14px;color:var(--muted);text-align:center}
.alt a{color:var(--silver);text-underline-offset:3px}
.alt a:hover{color:#fff}
.ok{margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(138,22,54,.35);border:1px solid rgba(164,27,66,.7);font-size:14px;text-align:center;display:none}
.ok.show{display:block}

@media (max-width:760px){
  .panel{position:relative;left:auto!important;right:auto!important;top:auto!important;width:auto!important;margin:0 16px}
  .view{overflow-y:auto;padding:5vh 0}
  .choice{top:10%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="view" id="home" aria-label="Welcome">
  <nav class="choice">
    <a href="#login">Login</a>
    <span class="divider" aria-hidden="true"></span>
    <a href="#signup">Sign Up</a>
  </nav>
</section>

<section class="view" id="login" aria-label="Login">
  <form class="panel" id="loginForm" novalidate>
    <h1>Login</h1>
    <div class="field">
      <label for="l-email">Email</label>
      <input id="l-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr">
      <span class="err" data-for="l-email"></span>
    </div>
    <div class="field">
      <label for="l-pass">Password</label>
      <input id="l-pass" name="password" type="password" autocomplete="current-password" dir="ltr">
      <span class="err" data-for="l-pass"></span>
    </div>
    <button type="submit">Login</button>
    <div class="ok" id="loginOk" role="status">Login details look good.</div>
    <p class="alt">No account yet? <a href="#signup">Sign Up</a></p>
  </form>
</section>

<section class="view" id="signup" aria-label="Sign Up">
  <form class="panel" id="signupForm" novalidate>
    <h1>Sign Up</h1>
    <div class="row">
      <div class="field">
        <label for="s-first">First name</label>
        <input id="s-first" name="first" type="text" autocomplete="given-name" dir="ltr">
        <span class="err" data-for="s-first"></span>
      </div>
      <div class="field">
        <label for="s-last">Last name</label>
        <input id="s-last" name="last" type="text" autocomplete="family-name" dir="ltr">
        <span class="err" data-for="s-last"></span>
      </div>
    </div>
    <div class="field">
      <label for="s-email">Email</label>
      <input id="s-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr">
      <span class="err" data-for="s-email"></span>
    </div>
    <div class="field">
      <label for="s-pass">Password</label>
      <input id="s-pass" name="password" type="password" autocomplete="new-password" dir="ltr">
      <span class="err" data-for="s-pass"></span>
    </div>
    <div class="field">
      <label for="s-pass2">Confirm password</label>
      <input id="s-pass2" name="password2" type="password" autocomplete="new-password" dir="ltr">
      <span class="err" data-for="s-pass2"></span>
    </div>
    <button type="submit">Register</button>
    <div class="ok" id="signupOk" role="status">Registration details look good.</div>
    <p class="alt">Already registered? <a href="#login">Login</a></p>
  </form>
</section>

<script>
const views=['home','login','signup'];
function show(id){
  if(!views.includes(id)) id='home';
  views.forEach(v=>document.getElementById(v).classList.toggle('active',v===id));
  document.title=id==='login'?'Login':id==='signup'?'Sign Up':'Login / Sign Up';
  document.querySelectorAll('.ok').forEach(e=>e.classList.remove('show'));
  window.scrollTo(0,0);
}
// Handle clicks directly so navigation works even where URL hashes are blocked
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(!a) return;
  e.preventDefault();
  const id=a.getAttribute('href').slice(1);
  show(id);
  try{history.replaceState(null,'','#'+id)}catch(err){}
});
window.addEventListener('hashchange',()=>show((location.hash||'#home').slice(1)));
show((location.hash||'#home').slice(1));

const emailRe=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const nameRe=/^[A-Za-z][A-Za-z '\-]*$/;

function setErr(id,msg){
  const input=document.getElementById(id);
  const out=document.querySelector('[data-for="'+id+'"]');
  out.textContent=msg||'';
  input.classList.toggle('bad',!!msg);
  input.setAttribute('aria-invalid',msg?'true':'false');
  return !msg;
}
function checkEmail(id){
  const v=document.getElementById(id).value.trim();
  if(!v) return setErr(id,'Enter your email.');
  if(!emailRe.test(v)) return setErr(id,'Enter a valid email, like name@example.com.');
  return setErr(id);
}
function checkName(id,label){
  const v=document.getElementById(id).value.trim();
  if(!v) return setErr(id,'Enter your '+label+'.');
  if(!nameRe.test(v)) return setErr(id,'Use English letters only.');
  return setErr(id);
}

document.getElementById('loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const a=checkEmail('l-email');
  const p=setErr('l-pass',document.getElementById('l-pass').value?'':'Enter your password.');
  document.getElementById('loginOk').classList.toggle('show',a&&p);
  // TODO: send email + password to your server here
});

document.getElementById('signupForm').addEventListener('submit',e=>{
  e.preventDefault();
  const pw=document.getElementById('s-pass').value;
  const pw2=document.getElementById('s-pass2').value;
  const res=[
    checkName('s-first','first name'),
    checkName('s-last','last name'),
    checkEmail('s-email'),
    setErr('s-pass',!pw?'Create a password.':pw.length<8?'Use at least 8 characters.':''),
    setErr('s-pass2',!pw2?'Repeat your password.':pw!==pw2?'Passwords do not match.':'')
  ];
  document.getElementById('signupOk').classList.toggle('show',res.every(Boolean));
  // TODO: send first name, last name, email, password to your server here
});
</script>
</body>
</html>
